<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Floating Dock Nav - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dock-wrapper">
    <header class="dock-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Bioluminescent Floating Dock</h1>
      <p>A floating pill navigation menu featuring proximity neon glow waves, tooltip popovers, and glass reflection.</p>
    </header>

    <nav class="bio-dock" aria-label="Bioluminescent Dock Navigation">
      <a href="#" class="bio-item active" aria-label="Home Dashboard" tabindex="0">
        <span class="tooltip">Dashboard</span>
        <span class="icon">🏠</span>
        <span class="glow-indicator"></span>
      </a>
      <a href="#" class="bio-item" aria-label="Analytics" tabindex="0">
        <span class="tooltip">Analytics</span>
        <span class="icon">📊</span>
        <span class="glow-indicator"></span>
      </a>
      <a href="#" class="bio-item" aria-label="Projects" tabindex="0">
        <span class="tooltip">Projects</span>
        <span class="icon">🚀</span>
        <span class="glow-indicator"></span>
      </a>
      <div class="divider"></div>
      <a href="#" class="bio-item" aria-label="Settings" tabindex="0">
        <span class="tooltip">Settings</span>
        <span class="icon">⚙️</span>
        <span class="glow-indicator"></span>
      </a>
    </nav>
  </div>
</body>
</html>
