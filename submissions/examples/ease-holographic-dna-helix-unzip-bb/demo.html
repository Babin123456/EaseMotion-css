<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic DNA Helix Unzip - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dna-wrapper">
    <header class="dna-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Holographic DNA Helix Unzip</h1>
      <p>Interactive 3D double helix loader featuring base-pair unzipping keyframe transitions, chromatic glowing nodes, and glass backdrop elevation.</p>
    </header>

    <div class="dna-card" tabindex="0" aria-label="Interactive Holographic DNA Strand">
      <div class="helix-container">
        <!-- Base Pair Rungs -->
        <div class="rung r1"><span class="node n-left">A</span><span class="strand-bar"></span><span class="node n-right">T</span></div>
        <div class="rung r2"><span class="node n-left">C</span><span class="strand-bar"></span><span class="node n-right">G</span></div>
        <div class="rung r3"><span class="node n-left">T</span><span class="strand-bar"></span><span class="node n-right">A</span></div>
        <div class="rung r4"><span class="node n-left">G</span><span class="strand-bar"></span><span class="node n-right">C</span></div>
        <div class="rung r5"><span class="node n-left">A</span><span class="strand-bar"></span><span class="node n-right">T</span></div>
        <div class="rung r6"><span class="node n-left">C</span><span class="strand-bar"></span><span class="node n-right">G</span></div>
      </div>
      <div class="dna-footer">
        <span class="genome-id">GENOME-SEQ // CHROMOSOME 12</span>
        <span class="unzip-status">UNZIP RATIO: 64%</span>
      </div>
    </div>
  </div>
</body>
</html>
