<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Retinal Scanner HUD - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scanner-wrapper">
    <header class="scanner-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Biometric Retinal Scanner HUD</h1>
      <p>A sci-fi security authentication card with iris targeting reticles, vertical laser beam sweep keyframes, and biometric status indicators.</p>
    </header>

    <div class="scanner-card" tabindex="0" aria-label="Biometric Retinal Scanner Lock">
      <div class="hud-aperture">
        <div class="outer-ring"></div>
        <div class="iris-target"></div>
        <div class="scan-laser"></div>
        <div class="crosshairs"></div>
      </div>
      <div class="scanner-info">
        <span class="scan-state">SCANNING RETINA...</span>
        <span class="scan-match">MATCH CONFIDENCE: 99.8%</span>
      </div>
    </div>
  </div>
</body>
</html>
