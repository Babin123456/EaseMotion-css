<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Morphing Liquid Wave Button - Demo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="demo-wrapper">
    <header class="header">
      <span class="badge">Fluid Organic Motion</span>
      <h1>Morphing Liquid Wave Button</h1>
      <p>Interactive CTA buttons featuring continuous fluid liquid waves, border-radius morphing, and elastic ripples.</p>
    </header>

    <div class="button-showcase">
      <!-- Primary Liquid Wave Button -->
      <a href="#" class="liquid-btn btn-cyan">
        <span class="btn-text">Get Started Now</span>
        <div class="liquid-wave"></div>
        <div class="liquid-wave wave-2"></div>
      </a>

      <!-- Secondary Gradient Morph Button -->
      <a href="#" class="liquid-btn btn-purple">
        <span class="btn-text">Launch Workspace</span>
        <div class="liquid-wave"></div>
        <div class="liquid-wave wave-2"></div>
      </a>
    </div>
  </div>
</body>
</html>
