<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Jellyfish Bell Pulse - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="jellyfish-wrapper">
    <header class="jellyfish-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Bioluminescent Jellyfish Pulse</h1>
      <p>A bio-inspired fluid loader featuring elastic umbrella bell contraction keyframes, trailing neon tentacles, and glowing particle aura.</p>
    </header>

    <div class="jellyfish-card" tabindex="0" aria-label="Bioluminescent Jellyfish Animation">
      <div class="jellyfish-body">
        <div class="jelly-bell">
          <div class="bell-inner-glow"></div>
        </div>
        <div class="tentacles">
          <div class="tentacle t1"></div>
          <div class="tentacle t2"></div>
          <div class="tentacle t3"></div>
          <div class="tentacle t4"></div>
          <div class="tentacle t5"></div>
        </div>
      </div>
      <div class="pulse-ring"></div>
      <div class="status-label">PROPULSION ACTIVE • 1.4 Hz</div>
    </div>
  </div>
</body>
</html>
