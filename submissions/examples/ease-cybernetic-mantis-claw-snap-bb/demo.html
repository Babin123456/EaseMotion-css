<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernetic Mantis Claw Snap - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="mantis-wrapper">
    <header class="mantis-header">
      <span class="badge">GSSoC 2026 Component</span>
      <h1>Cybernetic Mantis Claw Snap</h1>
      <p>A high-speed biomechanical action button featuring sharp scissor-lock keyframe snaps, laser sights, and cybernetic spark bursts.</p>
    </header>

    <div class="mantis-container">
      <button class="mantis-btn" type="button" aria-label="Engage Cybernetic Mantis Lock">
        <div class="claw claw-left">
          <div class="blade"></div>
          <div class="joint"></div>
        </div>
        <div class="claw claw-right">
          <div class="blade"></div>
          <div class="joint"></div>
        </div>
        <div class="btn-core">
          <span class="btn-label">ENGAGE LOCK</span>
          <span class="btn-sub">MANTIS-v4 PROTOCOL</span>
        </div>
        <div class="laser-beam"></div>
      </button>
    </div>
  </div>
</body>
</html>
