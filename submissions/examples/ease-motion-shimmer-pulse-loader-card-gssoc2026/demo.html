<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Shimmer Pulse Loader Card - Demo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="demo-wrapper">
    <header class="header">
      <span class="badge">Loading States</span>
      <h1>Shimmer Pulse Loader Grid</h1>
      <p>Hardware-accelerated CSS shimmer sweeps for content placeholder skeleton loaders.</p>
    </header>

    <div class="skeleton-grid">
      <!-- Skeleton Card 1 -->
      <div class="skeleton-card">
        <div class="skeleton-media shimmer"></div>
        <div class="skeleton-body">
          <div class="skeleton-avatar shimmer"></div>
          <div class="skeleton-text-group">
            <div class="skeleton-line line-title shimmer"></div>
            <div class="skeleton-line line-sub shimmer"></div>
          </div>
        </div>
        <div class="skeleton-paragraph">
          <div class="skeleton-line line-full shimmer"></div>
          <div class="skeleton-line line-full shimmer"></div>
          <div class="skeleton-line line-short shimmer"></div>
        </div>
      </div>

      <!-- Skeleton Card 2 -->
      <div class="skeleton-card">
        <div class="skeleton-media shimmer"></div>
        <div class="skeleton-body">
          <div class="skeleton-avatar shimmer"></div>
          <div class="skeleton-text-group">
            <div class="skeleton-line line-title shimmer"></div>
            <div class="skeleton-line line-sub shimmer"></div>
          </div>
        </div>
        <div class="skeleton-paragraph">
          <div class="skeleton-line line-full shimmer"></div>
          <div class="skeleton-line line-full shimmer"></div>
          <div class="skeleton-line line-short shimmer"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
