<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Glow Audio Equalizer - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="player-container">
    <div class="player-header">
      <div class="track-badge">NOW PLAYING</div>
      <h1 class="track-title">Cybernetic Synthwave Spectrum</h1>
      <p class="track-artist">EaseMotion Audio Studio • 128 BPM</p>
    </div>

    <div class="equalizer-wrapper">
      <div class="eq-bar bar-1"></div>
      <div class="eq-bar bar-2"></div>
      <div class="eq-bar bar-3"></div>
      <div class="eq-bar bar-4"></div>
      <div class="eq-bar bar-5"></div>
      <div class="eq-bar bar-6"></div>
      <div class="eq-bar bar-7"></div>
      <div class="eq-bar bar-8"></div>
      <div class="eq-bar bar-9"></div>
      <div class="eq-bar bar-10"></div>
      <div class="eq-bar bar-11"></div>
      <div class="eq-bar bar-12"></div>
    </div>

    <div class="player-controls">
      <div class="time-stamp">01:42 / 03:55</div>
      <div class="control-btn play-btn">
        <span class="icon">▌▌</span>
      </div>
      <div class="volume-badge">STEREO 96kHz</div>
    </div>
  </div>
</body>
</html>
