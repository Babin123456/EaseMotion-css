<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Interactive IDE Code Terminal | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="terminal-wrapper">
    <div class="terminal-window">
      <!-- Window Titlebar -->
      <div class="terminal-header">
        <div class="window-controls">
          <span class="control close"></span>
          <span class="control minimize"></span>
          <span class="control maximize"></span>
        </div>
        <div class="terminal-title">easemotion-core.config.ts</div>
        <div class="terminal-badge">UTF-8</div>
      </div>

      <!-- Code Body -->
      <div class="terminal-body">
        <div class="line-numbers">
          <span>01</span>
          <span>02</span>
          <span>03</span>
          <span>04</span>
          <span>05</span>
          <span>06</span>
          <span>07</span>
          <span>08</span>
        </div>
        
        <div class="code-content">
          <div class="code-line"><span class="keyword">import</span> { <span class="entity">defineMotionConfig</span> } <span class="keyword">from</span> <span class="string">'@easemotion/core'</span>;</div>
          <div class="code-line"></div>
          <div class="code-line"><span class="keyword">export default</span> <span class="entity">defineMotionConfig</span>({</div>
          <div class="code-line indent"><span class="property">preset</span>: <span class="string">'cyber-hologram-v4'</span>,</div>
          <div class="code-line indent"><span class="property">gpuAcceleration</span>: <span class="boolean">true</span>,</div>
          <div class="code-line indent"><span class="property">fpsTarget</span>: <span class="number">60</span>,</div>
          <div class="code-line indent"><span class="property">reducedMotionFallback</span>: <span class="string">'linear-fade'</span>,</div>
          <div class="code-line">}); <span class="cursor-blink"></span></div>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="terminal-footer">
        <span class="status-mode">NORMAL</span>
        <span class="status-info">main* | TypeScript | Ln 8, Col 4</span>
      </div>
    </div>
  </div>
</body>
</html>
